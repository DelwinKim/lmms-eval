dataset_path: lmms-lab/ai2d
task: "ai2d_direct_strict_v1"
dataset_kwargs:
  token: True
test_split: test
output_type: generate_until
doc_to_visual: !function utils.ai2d_doc_to_visual
doc_to_text: !function utils.ai2d_doc_to_text
doc_to_target: !function utils.ai2d_doc_to_target

lmms_eval_specific_kwargs:
  default:
    prompt_format: mcq
    pre_prompt: ""
    post_prompt: "\nRespond with exactly one uppercase letter: A, B, C, or D. Do not provide reasoning or any additional text."

model_specific_target_kwargs:
  default: "mcq"

generation_kwargs:
  max_new_tokens: 16
  temperature: 0
  do_sample: false

filter_list:
  - name: "strict-direct-extract-v1"
    filter:
      - function: !function utils.StrictDirectAnswerFilter

metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
    ignore_case: false
    ignore_punctuation: false

metadata:
  version: 1.0
  protocol: "local_custom_strict_direct_v1"
  description: "Local custom protocol, not an external packaged task. Accepts exactly one uppercase A-D response after trimming surrounding whitespace; rejects lowercase, punctuation, prose, and multi-option answers."
